<li data-marpit-fragment="3">目标：用时间换空间，减少重复的矩阵乘法，显著提升长序列生成速度</li>
</ul>

<h3 id="paged-attentionkv-%E5%88%86%E9%A1%B5">Paged Attention（KV 分页）</h3>
<p><img src="../images/2025/l12/paged_attention.png" alt="paged_attention center" /></p>
<ul>
<li data-marpit-fragment="1">将 KV Cache 划分为固定大小的 pages，便于增删/复用</li>
<li data-marpit-fragment="2">Prefill 阶段写入 page；Decode 阶段按需加载/替换，按 page 维度做预取和缓存</li>
<li data-marpit-fragment="3">好处：降低碎片化，方便淘汰冷门上下文，也为后续「只取部分 KV」的策略打基础</li>
</ul>
</section>

<h3 id="%E8%BF%87%E6%B8%A1%E4%BB%8E-kv-cache-%E5%88%B0-sparse-attention">过渡：从 KV Cache 到 Sparse Attention</h3>
<ul>
<li data-marpit-fragment="1">KV Cache 解决了「重复计算」问题，但没有解决「计算哪些 KV」问题</li>
<li data-marpit-fragment="2">Sparse Attention 的核心：在 decode 时只对少量关键 KV 计算注意力，直接减少乘法/softmax 的计算量</li>
<li data-marpit-fragment="3">因为 KV 已分页/可索引，我们可以：
<ul>
<li data-marpit-fragment="4">依据启发式/激活分数挑选“热点” page/token</li>
<li data-marpit-fragment="5">对“冷门” page 做淘汰或压缩（量化/池化）</li>
</ul>
</li>
<li data-marpit-fragment="6">结果：显存占用、带宽和计算量一起下降，长上下文推理更快更稳</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-fragments="4" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="9" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="26">
<h3 id="paged-attention-%E5%AE%9E%E8%B7%B5%E4%BB%A5-vllmpageattention-%E4%B8%BA%E4%BE%8B">Paged Attention 实践（以 vLLM/PageAttention 为例）</h3>
<ul>
<li data-marpit-fragment="1">Page 大小：通常 16~32 个 token，便于 LLVM/GPU 上做向量化和预取</li>
<li data-marpit-fragment="2">分配与复用：prefill 阶段连续分配，decode 阶段按 page 回收/重用，减少内存碎片</li>
<li data-marpit-fragment="3">热度排序：维护 page-level 的访问计数/最近访问步，优先保留“热” page，淘汰“冷” page</li>
<li data-marpit-fragment="4">计算路径：对当前 Q 先筛 page（如根据局部得分或启发式），仅对入选 page 内的 token 做注意力，从分页直接过渡到 Sparse Attention</li>
</ul>
</section>

<h3 id="%E9%95%BF%E6%96%87%E6%9C%AC%E5%9C%BA%E6%99%AF">长文本场景</h3>
<p>在输入序列较长的应用场景中，例如：</p>
<ul>
<li data-marpit-fragment="1">生成长文档总结</li>
<li data-marpit-fragment="2">大规模代码分析</li>
<li data-marpit-fragment="3">多文档问答</li>
<li data-marpit-fragment="4">多轮对话</li>
</ul>
<p>平方级的复杂度导致 Self-Attention 计算速度显著变慢，限制了大模型在这些场景中的广泛应用。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="13" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="26">
<h3 id="%E6%80%9D%E8%80%83">思考</h3>
<p>本质上，计算 Self-Attention 的过程就是让所有 token “注意” 其他所有 token 的过程。</p>
<p>联想：平时我们在阅读文章时，并不会一个字一个字地理解，往往是通读一遍抓住关键词，就能掌握大致意思。</p>
<p><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f50d.svg" data-marp-twemoji=""/> <strong>问题：真的需要每个 token 都“注意”所有其他 token 吗？</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="14" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="26">
<h3 id="%E8%A7%82%E5%AF%9F">观察</h3>
<p>在 llama3 模型上输入 &quot;A is B. C is D. A is&quot; 并设置 max_new_tokens=1 (prefill) 得到以下 Attention Heatmap（部分），其中颜色由暗到亮（由紫到黄）表示激活值从小到大（0-1）。</p>
<img src="../images/2025/l12/sparsity.png" width="100%" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-fragments="3" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="15" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="26">
<h3 id="%E7%A8%80%E7%96%8F%E6%80%A7sparsity">稀疏性（Sparsity）</h3>
<p>在 Self-Attention 计算过程中:</p>
<ul>

<h3 id="sparse-attention-%E5%88%86%E7%B1%BB">Sparse Attention 分类</h3>
<ol>
<li>根据如何筛选关键 token：
<ul>
<li data-marpit-fragment="1">Static pattern</li>
<li data-marpit-fragment="2">Dynamic pattern</li>
</ul>
</li>
<li>根据是否需要训练：
<ul>
<li data-marpit-fragment="3">Training-free</li>
<li data-marpit-fragment="4">Training-based</li>
</ul>
</li>
</ol>
<p>由于训练需要消耗大量资源，学术界主要聚焦在 Training-free 或只要简单训练的方法上；而部分大模型厂商（如 DeepSeek）正在尝试 Training-based Sparse Attention。</p>
</section>

<h3 id="static-pattern-%E6%96%B9%E6%B3%95%E7%AE%80%E4%BB%8B">Static pattern 方法简介</h3>
<ol>
<li>
<p>Sliding windows: 维护一个固定大小的窗口，保留最近的 tokens 参与计算，其余全部丢弃。</p>
<ul>
<li data-marpit-fragment="1">优点：实现简单，计算复杂度降低到 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="5.495ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 2429 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D442" d="M740 435Q740 320 676 213T511 42T304 -22Q207 -22 138 35T51 201Q50 209 50 244Q50 346 98 438T227 601Q351 704 476 704Q514 704 524 703Q621 689 680 617T740 435ZM637 476Q637 565 591 615T476 665Q396 665 322 605Q242 542 200 428T157 216Q157 126 200 73T314 19Q404 19 485 98T608 313Q637 408 637 476Z"></path></g><g data-mml-node="mo" transform="translate(763,0)"><path data-c="28" d="M94 250Q94 319 104 381T127 488T164 576T202 643T244 695T277 729T302 750H315H319Q333 750 333 741Q333 738 316 720T275 667T226 581T184 443T167 250T184 58T225 -81T274 -167T316 -220T333 -241Q333 -250 318 -250H315H302L274 -226Q180 -141 137 -14T94 250Z"></path></g><g data-mml-node="mi" transform="translate(1152,0)"><path data-c="1D441" d="M234 637Q231 637 226 637Q201 637 196 638T191 649Q191 676 202 682Q204 683 299 683Q376 683 387 683T401 677Q612 181 616 168L670 381Q723 592 723 606Q723 633 659 637Q635 637 635 648Q635 650 637 660Q641 676 643 679T653 683Q656 683 684 682T767 680Q817 680 843 681T873 682Q888 682 888 672Q888 650 880 642Q878 637 858 637Q787 633 769 597L620 7Q618 0 599 0Q585 0 582 2Q579 5 453 305L326 604L261 344Q196 88 196 79Q201 46 268 46H278Q284 41 284 38T282 19Q278 6 272 0H259Q228 2 151 2Q123 2 100 2T63 2T46 1Q31 1 31 10Q31 14 34 26T39 40Q41 46 62 46Q130 49 150 85Q154 91 221 362L289 634Q287 635 234 637Z"></path></g><g data-mml-node="mo" transform="translate(2040,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z"></path></g></g></g></svg></mjx-container>；</li>
<li data-marpit-fragment="2">缺点：精度损失较大，尤其是在长度超过预训练长度后大幅下降。</li>
</ul>
</li>
</ol>
<p><img src="../images/2025/l12/sliding_window.png" alt="sliding_window center" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="19" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="26">
<h3 id="static-pattern-%E6%96%B9%E6%B3%95%E7%AE%80%E4%BB%8B-1">Static pattern 方法简介</h3>
<ol start="2">
<li>Attention sinks: <a href="https://arxiv.org/abs/2309.17453">StreamingLLM</a> 发现注意力权重往往会集中在首 token 上，将这一现象称为 attention sinks。基于该发现，StreamingLLM 在 sliding window 的基础上进一步保留 attention sinks，降低了长文本场景下稀疏导致的精度损失。</li>
</ol>
<p><img src="../images/2025/l12/streamingllm.png" alt="streamingllm center" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="20" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="26">
<h3 id="static-pattern-%E6%96%B9%E6%B3%95%E7%AE%80%E4%BB%8B-2">Static pattern 方法简介</h3>
<p>总体上看，这些固定的模式往往不能适应文本生成中变化的关键 token，或多或少会有较显著的精度损失。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="21" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="26">
<h3 id="dynamic-pattern-%E6%96%B9%E6%B3%95%E7%AE%80%E4%BB%8B">Dynamic pattern 方法简介</h3>
<ol>
<li><a href="https://arxiv.org/abs/2407.02490">MInference</a> 通过观察注意力矩阵，总结出三种常见模式，根据输入动态选择最合适的模式，从而加速 prefill 阶段：</li>
</ol>
<img src="../images/2025/l12/minference.png" width="100%" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="22" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="26">
<h3 id="dynamic-pattern-%E6%96%B9%E6%B3%95%E7%AE%80%E4%BB%8B-1">Dynamic pattern 方法简介</h3>
<ol start="2">
<li><a href="https://arxiv.org/abs/2406.10774">Quest</a> 采用分页设计，估计每个 KV page 与当前 Q 的相似度，动态选择最相似（激活值最高）的 pages 参与计算：<br />
<img src="../images/2025/l12/quest.png" alt="quest center" style="height:450px;" /></li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-fragments="2" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="23" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="26">
<h3 id="dynamic-pattern-%E6%96%B9%E6%B3%95%E7%AE%80%E4%BB%8B-2">Dynamic pattern 方法简介</h3>
<ul>
<li data-marpit-fragment="1">
<p>优点：相较于 static pattern，dynamic pattern 类的方法精度更高；</p>
</li>
<li data-marpit-fragment="2">
<p>缺点：由于计算最合适的 tokens 会引入一定 overhead，综合下来会比简单的 static pattern 方法慢（但是相比 dense attention 还是有加速效果）;同时，如何设计选择算法也依赖经验（启发式）。</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="24" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="26">
<h3 id="training-based-%E6%96%B9%E6%B3%95%E7%AE%80%E4%BB%8B">Training-based 方法简介</h3>
<ol>
<li><a href="https://arxiv.org/pdf/2502.11089">NSA</a> 通过门控机制融合了粗粒度 token 压缩、细粒度的 token 选择和滑动窗口这三个模块的输出，从而达到稀疏效果。</li>
</ol>
<p><img src="../images/2025/l12/nsa.png" alt="NSA center" style="height:300px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="25" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="26">
<h3 id="training-based-%E6%96%B9%E6%B3%95%E7%AE%80%E4%BB%8B-1">Training-based 方法简介</h3>
<ol start="2">
<li><a href="https://github.com/deepseek-ai/DeepSeek-V3.2-Exp/blob/main/DeepSeek_V3_2.pdf">DSA</a> 主要在 <a href="https://arxiv.org/abs/2412.19437">MLA</a> 的基础上加上了稀疏模块（绿色部分）。本质上，Lightning Indexer 利用量化后（FP8）的 qk 计算 attention，根据这一轻量计算选择与 Q 最相似的 K。<br />
<img src="../images/2025/l12/dsa.png" alt="DSA center" style="height:400px;" /></li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="26" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="26">
<h3 id="training-based-%E6%96%B9%E6%B3%95%E7%AE%80%E4%BB%8B-2">Training-based 方法简介</h3>
<p>总体而言，Training-based 方法由于其成本高，当前大模型厂商少有投入。但从 DeepSeek 公布的效果来看(NSA)，训练后的原生 Sparse Attention 精度几乎无损甚至能反超 Dense Attention，推理速度也更快。<br />
<img src="../images/2025/l12/nsa_performance.png" alt="nsa_performance center" style="height:350px;" /></p>
</section>
