<h2 id="llm%E8%AE%AD%E7%BB%83%E6%89%A7%E8%A1%8C">LLM训练执行</h2>
<ul>

<h2 id="%E6%95%B0%E6%8D%AE%E5%87%86%E5%A4%87%E4%BB%8E%E8%AF%AD%E6%96%99%E5%88%B0%E5%8F%AF%E8%AE%AD%E7%BB%83%E6%A0%B7%E6%9C%AC">数据准备：从语料到可训练样本</h2>
<ul>
<li data-marpit-fragment="1">数据来源：开源语料、业务日志、合成数据</li>
<li data-marpit-fragment="2">质量控制：清洗噪声、去重复、敏感信息脱敏</li>
<li data-marpit-fragment="3">样本结构：明确字段（instruction/input/output/messages）</li>
<li data-marpit-fragment="4">划分策略：train/validation/test避免数据泄漏</li>
<li data-marpit-fragment="5">Tokenizer对齐：确保训练与推理共享词表及预处理</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="8" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="%E6%95%B0%E6%8D%AE%E5%87%86%E5%A4%87%E6%B5%81%E7%A8%8B%E6%A6%82%E8%A7%88">数据准备：流程概览</h2>
<ol>
<li>从公开数据集中载入（示例：Alpaca）</li>
<li>规则过滤并清洗文本</li>
<li>统一字段/模板便于拼接</li>
<li>拆分训练与验证集</li>
<li>Tokenizer对齐</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-fragments="2" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="9" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="step1-%E8%BD%BD%E5%85%A5alpaca%E6%95%B0%E6%8D%AE">Step1: 载入Alpaca数据</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> datasets <span class="hljs-keyword">import</span> load_dataset

raw_ds = load_dataset(<span class="hljs-string">&quot;tatsu-lab/alpaca&quot;</span>)
train_raw = raw_ds[<span class="hljs-string">&quot;train&quot;</span>]
</code></pre>
<ul>
<li data-marpit-fragment="1">直接使用HF镜像，避免手动下载/解析</li>
<li data-marpit-fragment="2"><code>train_raw</code>为<code>Dataset</code>对象，可继续链式操作</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-fragments="2" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="10" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="step2-%E8%A7%84%E5%88%99%E8%BF%87%E6%BB%A4">Step2: 规则过滤</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">keep_example</span>(<span class="hljs-params">example</span>):
    answer = example[<span class="hljs-string">&quot;output&quot;</span>].strip()
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">len</span>(answer) &gt; <span class="hljs-number">5</span>

filtered = train_raw.<span class="hljs-built_in">filter</span>(keep_example)
</code></pre>
<ul>
<li data-marpit-fragment="1"><code>filter</code>会自动并行处理，返回新的<code>Dataset</code></li>
<li data-marpit-fragment="2">可叠加敏感词、长度、语言检测等逻辑</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-fragments="2" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="11" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="step3-%E7%BB%9F%E4%B8%80%E5%AD%97%E6%AE%B5%E6%A8%A1%E6%9D%BF">Step3: 统一字段模板</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">build_messages</span>(<span class="hljs-params">example</span>):
    user_prompt = example[<span class="hljs-string">&quot;instruction&quot;</span>].strip()
    <span class="hljs-keyword">if</span> example[<span class="hljs-string">&quot;input&quot;</span>]:
        user_prompt += <span class="hljs-string">&quot;\n&quot;</span> + example[<span class="hljs-string">&quot;input&quot;</span>].strip()
    <span class="hljs-keyword">return</span> {
        <span class="hljs-string">&quot;messages&quot;</span>: [
            {<span class="hljs-string">&quot;role&quot;</span>: <span class="hljs-string">&quot;user&quot;</span>, <span class="hljs-string">&quot;content&quot;</span>: user_prompt},
            {<span class="hljs-string">&quot;role&quot;</span>: <span class="hljs-string">&quot;assistant&quot;</span>, <span class="hljs-string">&quot;content&quot;</span>: example[<span class="hljs-string">&quot;output&quot;</span>].strip()},
        ]
    }
structured = filtered.<span class="hljs-built_in">map</span>(build_messages)
</code></pre>
<ul>
<li data-marpit-fragment="1"><code>messages</code>结构兼容LLaMA Factory等框架</li>
<li data-marpit-fragment="2">也可保持<code>instruction/input/output</code>三字段</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-fragments="2" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="12" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="step4-%E5%88%92%E5%88%86%E8%AE%AD%E7%BB%83%E9%AA%8C%E8%AF%81">Step4: 划分训练/验证</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">split_data = structured.train_test_split(test_size=<span class="hljs-number">0.02</span>, seed=<span class="hljs-number">42</span>)
train_data = split_data[<span class="hljs-string">&quot;train&quot;</span>]
val_data = split_data[<span class="hljs-string">&quot;test&quot;</span>]
</code></pre>
<ul>
<li data-marpit-fragment="1"><code>train_test_split</code>基于随机种子保证可复现</li>
<li data-marpit-fragment="2">按任务标签分层：<code>train_test_split(..., stratify_by_column=&quot;category&quot;)</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-marpit-fragments="1" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="13" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="step4-%E5%88%92%E5%88%86%E8%AE%AD%E7%BB%83%E9%AA%8C%E8%AF%81-1">Step4: 划分训练/验证</h2>
<ul>
<li data-marpit-fragment="1">按长度分桶，先增加分桶字段，再使用<code>stratify_by_column</code>保持长短样本分布一致</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">add_length_bucket</span>(<span class="hljs-params">example</span>):
    length = <span class="hljs-built_in">len</span>(example[<span class="hljs-string">&quot;messages&quot;</span>][<span class="hljs-number">0</span>][<span class="hljs-string">&quot;content&quot;</span>].split())
    bucket = <span class="hljs-built_in">min</span>(length // <span class="hljs-number">200</span>, <span class="hljs-number">4</span>)  <span class="hljs-comment"># 0-4 共5档</span>
    example[<span class="hljs-string">&quot;len_bucket&quot;</span>] = bucket
    <span class="hljs-keyword">return</span> example
bucketed = structured.<span class="hljs-built_in">map</span>(add_length_bucket)
split_bucketed = bucketed.train_test_split(
    test_size=<span class="hljs-number">0.02</span>,
    seed=<span class="hljs-number">42</span>,
    stratify_by_column=<span class="hljs-string">&quot;len_bucket&quot;</span>,
)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-fragments="2" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="14" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="step5-tokenizer%E5%AF%B9%E9%BD%90%E5%88%9D%E5%A7%8B%E5%8C%96">Step5: Tokenizer对齐（初始化）</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> transformers <span class="hljs-keyword">import</span> AutoTokenizer

tokenizer = AutoTokenizer.from_pretrained(<span class="hljs-string">&quot;meta-llama/Llama-3.2-1b&quot;</span>)
tokenizer.pad_token = tokenizer.eos_token
</code></pre>
<ul>
<li data-marpit-fragment="1">统一tokenizer，避免训练/推理词表不一致</li>
<li data-marpit-fragment="2">某些模型需手动指定<code>pad_token</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-fragments="2" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="15" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="step5-tokenizer%E5%AF%B9%E9%BD%90%E6%9E%84%E9%80%A0%E6%A8%A1%E6%9D%BF">Step5: Tokenizer对齐（构造模板）</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">build_prompt</span>(<span class="hljs-params">example, max_length=<span class="hljs-number">2048</span></span>):
    user = example[<span class="hljs-string">&quot;messages&quot;</span>][<span class="hljs-number">0</span>][<span class="hljs-string">&quot;content&quot;</span>]
    assistant = example[<span class="hljs-string">&quot;messages&quot;</span>][<span class="hljs-number">1</span>][<span class="hljs-string">&quot;content&quot;</span>]
    <span class="hljs-keyword">return</span> (
        <span class="hljs-string">f&quot;&lt;|user|&gt;\n<span class="hljs-subst">{user}</span>\n&quot;</span>
        <span class="hljs-string">f&quot;&lt;|assistant|&gt;\n<span class="hljs-subst">{assistant}</span><span class="hljs-subst">{tokenizer.eos_token}</span>&quot;</span>
    )

<span class="hljs-built_in">print</span>(build_prompt(train_data[<span class="hljs-number">0</span>]).splitlines()[:<span class="hljs-number">4</span>])
</code></pre>
<ul>
<li data-marpit-fragment="1">显式构造模板，便于检查角色标记</li>
<li data-marpit-fragment="2">可换成自定义系统提示/多轮对话</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-fragments="2" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="16" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="step5-tokenizer%E5%AF%B9%E9%BD%90%E7%BC%96%E7%A0%81%E6%A0%87%E7%AD%BE">Step5: Tokenizer对齐（编码+标签）</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">tokenize</span>(<span class="hljs-params">example, max_length=<span class="hljs-number">2048</span></span>):
    text = build_prompt(example, max_length=max_length)
    tokenized = tokenizer(
        text,
        truncation=<span class="hljs-literal">True</span>,
        max_length=max_length,
    )
    tokenized[<span class="hljs-string">&quot;labels&quot;</span>] = tokenized[<span class="hljs-string">&quot;input_ids&quot;</span>].copy()
    <span class="hljs-keyword">return</span> tokenized
</code></pre>
<ul>
<li data-marpit-fragment="1">自回归任务直接复制<code>input_ids</code>为<code>labels</code></li>
<li data-marpit-fragment="2">若需mask部分prompt，可将对应的label置为<code>-100</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-fragments="3" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="17" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="step5-tokenizer%E5%AF%B9%E9%BD%90%E6%89%B9%E9%87%8F%E5%A4%84%E7%90%86">Step5: Tokenizer对齐（批量处理）</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">tokenized_train = train_data.<span class="hljs-built_in">map</span>(
    tokenize,
    remove_columns=train_data.column_names,
)

tokenized_val = val_data.<span class="hljs-built_in">map</span>(
    tokenize,
    remove_columns=val_data.column_names,
)
</code></pre>
<ul>
<li data-marpit-fragment="1"><code>map</code>自动并行，适合大规模数据</li>
<li data-marpit-fragment="2"><code>remove_columns</code>保留纯tensor字段，便于DataLoader/Trainer载入</li>
<li data-marpit-fragment="3">LLaMA Factory可通过<code>preprocess_func</code>复用同样逻辑</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-fragments="7" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="18" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="%E4%BB%8E%E9%A2%84%E5%A4%84%E7%90%86%E5%88%B0%E8%AE%AD%E7%BB%83%E6%95%B0%E6%8D%AE%E6%B5%81">从预处理到训练数据流</h2>
<ul>
<li data-marpit-fragment="1">预处理阶段：<code>map</code>逐样本构造prompt、标签、mask</li>
<li data-marpit-fragment="2">训练阶段：DataLoader按batch读取，需要统一长度</li>
<li data-marpit-fragment="3">Collate函数承担批次内的“最后一公里”
<ul>
<li data-marpit-fragment="4">padding使张量可堆叠</li>
<li data-marpit-fragment="5">生成<code>attention_mask</code>与<code>labels</code>中的忽略位</li>
<li data-marpit-fragment="6">可附加sample权重、position ids等训练信号、为定制loss构建对应label等</li>
</ul>
</li>
<li data-marpit-fragment="7">预处理 ≈ 单条样本准备；Collate ≈ 批次打包，两者衔接保证模型输入“稳定”</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-fragments="5" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="19" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="collate%E5%87%BD%E6%95%B0%E8%AE%BE%E8%AE%A1%E6%84%8F%E5%9B%BE">Collate函数设计意图</h2>
<ul>
<li data-marpit-fragment="1">解决变长序列在同一batch中堆叠的问题</li>
<li data-marpit-fragment="2">统一补齐长度（padding），避免模型错判真实token与填充token</li>
<li data-marpit-fragment="3">构造<code>attention_mask</code>与<code>labels</code>的忽略区域（<code>-100</code>）</li>
<li data-marpit-fragment="4">可注入额外信息：loss mask、position ids、sample权重</li>
<li data-marpit-fragment="5">与DataLoader协同，保证batch维度张量结构稳定</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-fragments="1" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="20" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="collate%E5%87%BD%E6%95%B0%E7%A4%BA%E4%BE%8Bcausal-lm">Collate函数示例：Causal LM</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> torch.nn.utils.rnn <span class="hljs-keyword">import</span> pad_sequence
<span class="hljs-keyword">import</span> torch
<span class="hljs-keyword">def</span> <span class="hljs-title function_">causal_lm_collate</span>(<span class="hljs-params">batch, pad_id, label_pad_id=-<span class="hljs-number">100</span></span>):
    input_ids = [torch.tensor(item[<span class="hljs-string">&quot;input_ids&quot;</span>]) <span class="hljs-keyword">for</span> item <span class="hljs-keyword">in</span> batch]
    labels = [torch.tensor(item[<span class="hljs-string">&quot;labels&quot;</span>]) <span class="hljs-keyword">for</span> item <span class="hljs-keyword">in</span> batch]
    attention = [torch.tensor(item[<span class="hljs-string">&quot;attention_mask&quot;</span>]) <span class="hljs-keyword">for</span> item <span class="hljs-keyword">in</span> batch]

    padded_input = pad_sequence(input_ids, batch_first=<span class="hljs-literal">True</span>, padding_value=pad_id)
    padded_labels = pad_sequence(labels, batch_first=<span class="hljs-literal">True</span>, padding_value=label_pad_id)
    padded_attention = pad_sequence(attention, batch_first=<span class="hljs-literal">True</span>, padding_value=<span class="hljs-number">0</span>)
    <span class="hljs-keyword">return</span> {
        <span class="hljs-string">&quot;input_ids&quot;</span>: padded_input,
        <span class="hljs-string">&quot;labels&quot;</span>: padded_labels,
        <span class="hljs-string">&quot;attention_mask&quot;</span>: padded_attention,
    }
</code></pre>
<ul>
<li data-marpit-fragment="1"><code>label_pad_id=-100</code>确保交叉熵在填充区域不计loss</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-fragments="2" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="21" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="collate%E5%87%BD%E6%95%B0%E6%8C%82%E8%BD%BD%E8%87%B3dataloader">Collate函数挂载至DataLoader</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> torch.utils.data <span class="hljs-keyword">import</span> DataLoader

train_loader = DataLoader(
    tokenized_train,
    batch_size=<span class="hljs-number">4</span>,
    shuffle=<span class="hljs-literal">True</span>,
    collate_fn=<span class="hljs-keyword">lambda</span> batch: causal_lm_collate(
        batch,
        pad_id=tokenizer.pad_token_id,
    ),
)
</code></pre>
<ul>
<li data-marpit-fragment="1">通过lambda传入pad token</li>
<li data-marpit-fragment="2">若使用Trainer，可传递给<code>data_collator</code>参数</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="22" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="collate%E5%87%BD%E6%95%B0%E4%B8%8Etrainer%E9%9B%86%E6%88%90">Collate函数与Trainer集成</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> transformers <span class="hljs-keyword">import</span> Trainer, TrainingArguments

training_args = TrainingArguments(
    output_dir=<span class="hljs-string">&quot;checkpoints/demo&quot;</span>,
    per_device_train_batch_size=<span class="hljs-number">1</span>,
    gradient_accumulation_steps=<span class="hljs-number">8</span>,
    learning_rate=<span class="hljs-number">2e-5</span>,
    num_train_epochs=<span class="hljs-number">3</span>,
)
trainer = Trainer(
    model=model,
    args=training_args,
    train_dataset=tokenized_train,
    eval_dataset=tokenized_val,
    data_collator=<span class="hljs-keyword">lambda</span> batch: causal_lm_collate(
        batch,
        pad_id=tokenizer.pad_token_id,
    ),
)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-fragments="8" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="23" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="%E7%9B%AE%E6%A0%87%E5%87%BD%E6%95%B0%E5%AE%9A%E4%B9%89%E6%A8%A1%E5%9E%8B%E8%A6%81%E5%AD%A6%E7%9A%84%E8%83%BD%E5%8A%9B">目标函数：定义模型要学的能力</h2>
<ul>
<li data-marpit-fragment="1">预训练与微调常用<strong>自回归交叉熵</strong>(Cross Entropy)
<ul>
<li data-marpit-fragment="2">目标：预测下一个token</li>
<li data-marpit-fragment="3">Label通常是右移一位的输入序列</li>
</ul>
</li>
<li data-marpit-fragment="4">变体
<ul>
<li data-marpit-fragment="5">Label smoothing：缓解过拟合</li>
<li data-marpit-fragment="6">限定loss区域：只对Assistant段落计loss</li>
<li data-marpit-fragment="7">多任务：对不同字段加权求和</li>
</ul>
</li>
<li data-marpit-fragment="8">指令微调数据：输入+输出拼接，再使用mask忽略Prompt部分</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-fragments="3" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="24" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="%E4%B8%BA%E4%BB%80%E4%B9%88labels%E6%98%AFinput_ids%E5%8F%B3%E7%A7%BB%E4%B8%80%E4%BD%8D">为什么labels是input_ids右移一位？</h2>
<ul>
<li data-marpit-fragment="1">自回归语言模型训练目标：在看到前<code>t</code>个token后预测第<code>t+1</code>个token</li>
<li data-marpit-fragment="2">模型前向输出<code>logits</code>与下一个输入对齐，即位置<code>t</code>的logit对应<code>t+1</code>的输入token</li>
<li data-marpit-fragment="3">为了计算预测<code>x_{t+1}</code>的loss，需要让<code>labels[t] = input_ids[t+1]</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-marpit-fragments="2" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="25" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="%E4%B8%BA%E4%BB%80%E4%B9%88labels%E6%98%AFinput_ids%E5%8F%B3%E7%A7%BB%E4%B8%80%E4%BD%8D-1">为什么labels是input_ids右移一位？</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">labels = tokenized[<span class="hljs-string">&quot;input_ids&quot;</span>].copy()
labels[:-<span class="hljs-number">1</span>] = labels[<span class="hljs-number">1</span>:]      <span class="hljs-comment"># 右移</span>
labels[-<span class="hljs-number">1</span>] = -<span class="hljs-number">100</span>             <span class="hljs-comment"># 最后一个位置无法预测下一个token</span>
labels[<span class="hljs-number">0</span>] = -<span class="hljs-number">100</span>              <span class="hljs-comment"># 忽略起始位置的loss</span>
tokenized[<span class="hljs-string">&quot;labels&quot;</span>] = labels
</code></pre>
<ul>
<li data-marpit-fragment="1">等价写法：直接复制<code>input_ids</code>并在loss计算前将prompt区域mask为<code>-100</code></li>
<li data-marpit-fragment="2">本质：让模型学会“给定上下文，预测下一个token”的条件概率</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-marpit-fragments="5" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="26" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="%E8%AE%AD%E7%BB%83%E6%89%A7%E8%A1%8C%E6%A2%AF%E5%BA%A6%E5%A6%82%E4%BD%95%E8%A2%AB%E8%AE%A1%E7%AE%97%E4%B8%8E%E6%9B%B4%E6%96%B0">训练执行：梯度如何被计算与更新</h2>
<ul>
<li data-marpit-fragment="1">高阶封装：<code>Trainer</code>/LLaMA Factory 屏蔽样板代码</li>
<li data-marpit-fragment="2">手写循环：自定义前向、反向、梯度累积</li>
<li data-marpit-fragment="3">混合精度：AMP/BF16 降低显存，提高吞吐</li>
<li data-marpit-fragment="4">优化器与调度器：AdamW、Adafactor + Warmup/Decay</li>
<li data-marpit-fragment="5">资源优化：gradient checkpointing、ZeRO、LoRA/QLoRA</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-fragments="5" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="27" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="%E8%AF%84%E4%BC%B0%E4%B8%8E%E4%BF%9D%E5%AD%98%E9%97%AD%E7%8E%AF%E4%BF%9D%E9%9A%9C%E5%8F%AF%E5%A4%8D%E7%8E%B0">评估与保存：闭环保障可复现</h2>
<ul>
<li data-marpit-fragment="1">在线监控：训练loss、学习率、梯度范数、显存</li>
<li data-marpit-fragment="2">验证集：PPL、任务指标、人工抽检输出</li>
<li data-marpit-fragment="3">日志系统：TensorBoard、W&amp;B(wandb.ai)</li>
<li data-marpit-fragment="4">Checkpoint：定期保存模型/优化器/配置</li>
<li data-marpit-fragment="5">元信息：记录数据版本、commit hash、命令行参数</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-fragments="9" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="28" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="%E7%94%A8llama-factory%E5%BE%AE%E8%B0%83">用LLaMA Factory微调</h2>
<ul>
<li data-marpit-fragment="1">环境
<ul>
<li data-marpit-fragment="2">Python 3.10+，<code>pip install llamafactory[torch]</code></li>
</ul>
</li>
<li data-marpit-fragment="3">基座模型
<ul>
<li data-marpit-fragment="4">HF格式(<code>--model_name_or_path</code>)或本地目录</li>
</ul>
</li>
<li data-marpit-fragment="5">数据
<ul>
<li data-marpit-fragment="6">SFT: json、jsonl或HF dataset</li>
<li data-marpit-fragment="7">对话字段需包含<code>instruction/input/output</code>或<code>messages</code></li>
</ul>
</li>
<li data-marpit-fragment="8">配置
<ul>
<li data-marpit-fragment="9"><code>train</code>阶段yaml/cli参数：LoRA、batch、优化器等</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-fragments="2" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="29" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="%E6%95%B0%E6%8D%AE%E7%A4%BA%E4%BE%8Bjsonl">数据示例（jsonl）</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;instruction&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;写一段自我介绍&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;input&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;output&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;大家好，我是南京大学的学生...&quot;</span><span class="hljs-punctuation">}</span>
<span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;instruction&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;翻译句子&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;input&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;LLM可以做什么？&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;output&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;What can an LLM do?&quot;</span><span class="hljs-punctuation">}</span>
</code></pre>
<ul>
<li data-marpit-fragment="1">或使用<code>messages</code>列表</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span>
  <span class="hljs-attr">&quot;messages&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">[</span>
    <span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;role&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;user&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;content&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;介绍一下课程安排&quot;</span><span class="hljs-punctuation">}</span><span class="hljs-punctuation">,</span>
    <span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;role&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;assistant&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;content&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;本课程包含建模、训练、推理三个模块&quot;</span><span class="hljs-punctuation">}</span>
  <span class="hljs-punctuation">]</span>
<span class="hljs-punctuation">}</span>
</code></pre>
<ul>
<li data-marpit-fragment="2">文件路径在配置中通过<code>train_file</code>引用</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-marpit-fragments="2" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="30" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="%E5%85%B8%E5%9E%8B%E8%AE%AD%E7%BB%83%E9%85%8D%E7%BD%AElora_qlorayaml">典型训练配置（lora_qlora.yaml）</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">stage:</span> <span class="hljs-string">sft</span>
<span class="hljs-attr">model_name_or_path:</span> <span class="hljs-string">/data/model/Meta-Llama-3-8B-Instruct</span>
<span class="hljs-attr">finetuning_type:</span> <span class="hljs-string">lora</span>
<span class="hljs-attr">template:</span> <span class="hljs-string">llama3</span>
<span class="hljs-attr">train_file:</span> <span class="hljs-string">data/alpaca.jsonl</span>
<span class="hljs-attr">val_file:</span> <span class="hljs-string">data/val.jsonl</span>
<span class="hljs-attr">output_dir:</span> <span class="hljs-string">output/lora-sft</span>
<span class="hljs-attr">per_device_train_batch_size:</span> <span class="hljs-number">1</span>
<span class="hljs-attr">gradient_accumulation_steps:</span> <span class="hljs-number">8</span>
<span class="hljs-attr">learning_rate:</span> <span class="hljs-number">2e-4</span>
<span class="hljs-attr">lr_scheduler_type:</span> <span class="hljs-string">cosine</span>
<span class="hljs-attr">warmup_ratio:</span> <span class="hljs-number">0.03</span>
<span class="hljs-attr">num_train_epochs:</span> <span class="hljs-number">3</span>
<span class="hljs-attr">lora_target:</span> <span class="hljs-string">q_proj,v_proj</span>
<span class="hljs-attr">bnb_4bit_quant_type:</span> <span class="hljs-string">nf4</span>
<span class="hljs-attr">save_total_limit:</span> <span class="hljs-number">3</span>
<span class="hljs-attr">logging_steps:</span> <span class="hljs-number">10</span>
</code></pre>
<ul>
<li data-marpit-fragment="1">可通过<code>template</code>指定prompt格式</li>
<li data-marpit-fragment="2"><code>bnb_4bit_*</code>参数用于QLoRA量化</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-marpit-fragments="5" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="31" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="%E5%90%AF%E5%8A%A8%E8%AE%AD%E7%BB%83%E5%91%BD%E4%BB%A4">启动训练命令</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">llamafactory train \
  --config configs/lora_qlora.yaml \
  --flash_attn \
  --gradient_checkpointing
</code></pre>
<ul>
<li data-marpit-fragment="1">常用参数
<ul>
<li data-marpit-fragment="2"><code>--resume_from_checkpoint</code>断点续训</li>
<li data-marpit-fragment="3"><code>--quantization_bit 4</code>快速设定QLoRA</li>
<li data-marpit-fragment="4"><code>--deepspeed configs/ds_z3.json</code>分布式</li>
</ul>
</li>
<li data-marpit-fragment="5">训练后<code>output_dir</code>包含LoRA权重、配置与日志</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-marpit-fragments="2" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="32" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="trainer%E5%BF%AB%E9%80%9F%E8%90%BD%E5%9C%B0%E8%AE%AD%E7%BB%83">Trainer：快速落地训练</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> transformers <span class="hljs-keyword">import</span> AutoModelForCausalLM, TrainingArguments, Trainer
model = AutoModelForCausalLM.from_pretrained(<span class="hljs-string">&quot;meta-llama/Llama-3-8b&quot;</span>)
tokenizer.pad_token = tokenizer.eos_token
args = TrainingArguments(
    output_dir=<span class="hljs-string">&quot;checkpoints/l10&quot;</span>,
    per_device_train_batch_size=<span class="hljs-number">1</span>,
    gradient_accumulation_steps=<span class="hljs-number">8</span>,
    learning_rate=<span class="hljs-number">2e-5</span>,
    warmup_ratio=<span class="hljs-number">0.03</span>,
    num_train_epochs=<span class="hljs-number">3</span>,
    fp16=<span class="hljs-literal">True</span>,
    logging_steps=<span class="hljs-number">10</span>,
    save_strategy=<span class="hljs-string">&quot;epoch&quot;</span>,
)
trainer = Trainer(
    model=model,
    args=args,
    train_dataset=train_ds,
    data_collator=<span class="hljs-keyword">lambda</span> batch: causal_lm_collator(batch, tokenizer.pad_token_id),
)
trainer.train()
</code></pre>
<ul>
<li data-marpit-fragment="1">优点：封装优化器、调度器、分布式、日志</li>
<li data-marpit-fragment="2">通过<code>compute_metrics</code>/<code>callbacks</code>扩展自定义逻辑</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="33" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h2 id="%E6%89%8B%E5%86%99%E8%AE%AD%E7%BB%83%E5%BE%AA%E7%8E%AF%E5%85%B3%E9%94%AE%E6%AD%A5%E9%AA%A4">手写训练循环：关键步骤</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> torch.optim <span class="hljs-keyword">import</span> AdamW
<span class="hljs-keyword">from</span> torch.cuda.amp <span class="hljs-keyword">import</span> GradScaler, autocast

optimizer = AdamW(model.parameters(), lr=<span class="hljs-number">2e-5</span>)
scaler = GradScaler(enabled=<span class="hljs-literal">True</span>)
model.train()
<span class="hljs-keyword">for</span> step, batch <span class="hljs-keyword">in</span> <span class="hljs-built_in">enumerate</span>(dataloader, start=<span class="hljs-number">1</span>):
    batch = {k: v.to(model.device) <span class="hljs-keyword">for</span> k, v <span class="hljs-keyword">in</span> batch.items()}
    <span class="hljs-keyword">with</span> autocast():
        outputs = model(**batch)
        loss = outputs.loss
    scaler.scale(loss).backward()
    <span class="hljs-keyword">if</span> step % grad_accumulation == <span class="hljs-number">0</span>:
        scaler.step(optimizer)
        scaler.update()
        optimizer.zero_grad()
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-marpit-fragments="8" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="34" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h1 id="%E8%AE%AD%E7%BB%83%E8%BF%87%E7%A8%8B%E4%B8%AD%E7%9A%84%E5%BA%A6%E9%87%8F%E4%B8%8E%E7%9B%91%E6%8E%A7">训练过程中的度量与监控</h1>
<ul>
<li data-marpit-fragment="1">在线指标
<ul>
<li data-marpit-fragment="2">训练loss、学习率、梯度范数</li>
</ul>
</li>
<li data-marpit-fragment="3">验证指标
<ul>
<li data-marpit-fragment="4">Perplexity、BLEU/ROUGE(指令)、自定义任务指标</li>
</ul>
</li>
<li data-marpit-fragment="5">工具
<ul>
<li data-marpit-fragment="6">Trainer内置TensorBoard、Wandb配置</li>
<li data-marpit-fragment="7">自定义Callback记录采样输出</li>
</ul>
</li>
<li data-marpit-fragment="8">及时发现过拟合、梯度异常、Nan</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-marpit-fragments="8" data-paginate="true" data-background-color="#fff" data-theme="gaia" lang="C" data-marpit-pagination="35" style="--paginate:true;--background-color:#fff;--theme:gaia;background-color:#fff;background-image:none;" data-marpit-pagination-total="35">
<h1 id="%E8%AE%AD%E7%BB%83%E5%AE%8C%E6%88%90%E5%90%8E%E7%9A%84%E5%8A%A8%E4%BD%9C">训练完成后的动作</h1>
<ul>
<li data-marpit-fragment="1">保存
<ul>
<li data-marpit-fragment="2"><code>save_pretrained</code>存储模型+Tokenizer</li>
<li data-marpit-fragment="3"><code>peft_state_dict</code>保存LoRA权重</li>
</ul>
</li>
<li data-marpit-fragment="4">转换
<ul>
<li data-marpit-fragment="5">转onnx、TensorRT、GGUF等部署格式</li>
</ul>
</li>
<li data-marpit-fragment="6">校验
<ul>
<li data-marpit-fragment="7">小样本推理验证</li>
<li data-marpit-fragment="8">版本化：记录数据版本、参数、代码哈希</li>
</ul>
</li>
</ul>
</section>
